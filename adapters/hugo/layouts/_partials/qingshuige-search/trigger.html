{{- /* Context: dict "page" PAGE, optional "floating" true and "label" TEXT. */ -}}
{{- $config := partial "qingshuige-search/config.html" .page.Site -}}
{{- if $config.enabled -}}
  <button class="qsg-search-trigger{{ if .floating }} qsg-search-trigger--floating{{ end }}" type="button" data-search-trigger aria-label="{{ .label | default "搜索文章" }}" aria-haspopup="dialog" aria-controls="qsg-search-dialog" aria-expanded="false" title="搜索（Ctrl/⌘ + K）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.2 4.2"/></svg>
    {{- if .floating -}}<span>搜索</span>{{- end -}}
  </button>
{{- end -}}
